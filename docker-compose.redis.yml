services:
  webapp:
    depends_on:
      - rabbitmq
    environment:
      - LORC_RABBITMQ_HOST
      - LORC_RABBITMQ_PASS
      - LORC_RABBITMQ_USER
  redis:
    image: redis:7.0.11
    container_name: redis
    hostname: redis
    ports:
      - "6379:6379"
